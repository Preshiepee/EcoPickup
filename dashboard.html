<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | EcoPickup</title>

    <link rel="stylesheet" href="dashboard.css ">

</head>
<body>

<header class="dashboard-header">

    <div class="logo">
        ♻ EcoPickup
    </div>

    <a href="login.html" class="logout-btn">
        Logout
    </a>

</header>

<section class="dashboard">

    <h1>Welcome 👋</h1>

    <p>
        Manage your waste pickup requests from your dashboard.
    </p>

    <div class="dashboard-cards">

        <a href="schedule.html" class="dashboard-card">

            <i class="fas fa-calendar-check"></i>

            <h3>Schedule Pickup</h3>

            <p> Book a new waste pickup</p>
        </a>

        <a href="history.html" class="dashboard-card">
            <i class="fas fa-history"></i>

            <h3>Pickup History</h3>
            <p>View all your previous requests</p>
        </a>

        <a href="profile.html" class="dashboard-card">

            <i class="fas fa-user"></i>

            <h3>Update Profile</h3>
            <p>Manage your personal information</p>
        </a>
    </div>

</section>

</body>
</html>
